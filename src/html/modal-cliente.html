<div id="clienteModal"
    class="cliente-modal">

    <div class="cliente-contenido">

        <button id="cerrarCliente"
            class="modal-cerrar">

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div class="section-title">

            <span>
                DATOS DEL CLIENTE
            </span>

            <h2>
                Finalizar pedido
            </h2>

            <p>
                Completa tus datos para enviar
                el pedido por WhatsApp.
            </p>

        </div>


        <form id="formCliente"
            class="form-cliente">


            <div class="form-grupo">

                <label>
                    Nombre completo
                </label>

                <input type="text"
                    id="clienteNombre"
                    required
                    placeholder="Tu nombre">

            </div>


            <div class="form-grupo">

                <label>
                    Teléfono
                </label>

                <input type="tel"
                    id="clienteTelefono"
                    required
                    placeholder="Tu número">

            </div>


            <div class="form-grupo">

                <label>
                    Ubicación
                </label>

                <input type="text"
                    id="clienteUbicacion"
                    placeholder="Ciudad o lugar de entrega">

            </div>


            <div class="form-grupo">

                <label>
                    Comentarios
                </label>

                <textarea id="clienteComentario"
                    placeholder="Información adicional..."></textarea>

            </div>


            <button type="submit"
                class="btn-finalizar">

                <i class="fa-brands fa-whatsapp"></i>

                Enviar pedido por WhatsApp

            </button>

        </form>

    </div>

</div>
